apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "minetest.fullname" . }}
spec:
  selector:
    matchLabels:
      app: {{ include "minetest.fullname" . }}
      component: minetest
  replicas: 1
  template:
    metadata:
      labels:
        app: {{ include "minetest.fullname" . }}
        component: minetest
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      {{- if .Values.backup }}
      - name: backup
        image: busybox
        command:
          - sh
          - -c
          - if [ -e '/config/.minetest' ]; then
              cd /config;
              tar -zcvf $(date +%Y%m%d%H%M).minetest.tgz .minetest;
            fi
        volumeMounts:
          - name: minetest-config
            mountPath: /config
      {{- end }}
      {{- if .Values.setGame }}
      - name: setgame
        image: alpine:3.20
        command:
          - /bin/sh
          - -c
          - |
            apk add --no-cache curl unzip > /dev/null 2>&1;
            GAME=$(echo {{ .Values.gameUrl }} | awk -F "/" '{print $(NF)}');
            mkdir -p /config/.minetest/games/;
            cd /config/.minetest/games/;
            curl -L -o /tmp/game.zip {{ .Values.gameUrl }}/download;
            unzip /tmp/game.zip -d /config/.minetest/games/;
            rm -f /tmp/game.zip;
            mkdir -p /config/.minetest/main-config/;
            echo "default_game = ${GAME}" > /config/.minetest/main-config/minetest.conf
        volumeMounts:
          - name: minetest-config
            mountPath: /config
      {{- end }}
      {{- if .Values.setOptions }}
      - name: options
        image: alpine:3.20
        command:
          - /bin/sh
          - -c
          - |
            mkdir -p /config/.minetest/main-config/;
            cat >> /config/.minetest/main-config/minetest.conf <<EOF
            enable_damage = {{ .Values.enableDamage }}
            creative_mode = {{ .Values.creativeMode }}
            free_mode = {{ .Values.freeMode }}
            fast_mode = {{ .Values.fastMode }}
            autojump = {{ .Values.autojump }}
            time_speed = {{ .Values.timeSpeed }}
            EOF
        volumeMounts:
          - name: minetest-config
            mountPath: /config
      {{- end }}
      containers:
      - name: minetest
        image: "{{ .Values.image.minetest.registry }}/{{ .Values.image.minetest.repository }}:{{ .Values.image.minetest.tag }}"
        imagePullPolicy: {{ .Values.image.minetest.pullPolicy }}
        volumeMounts:
          - name: minetest-config
            mountPath: /config/.minetest
            subPath: .minetest
        env:
          - name: TZ
            value: "{{ .Values.minetestTimezone }}"
          - name: PUID
            value: "{{ .Values.container.puid }}"
          - name: PGID
            value: "{{ .Values.container.pgid }}"
          - name: UMASK
            value: "{{ .Values.container.umask }}"
          - name: CLI_ARGS
            value: "{{ .Values.cliArgs }}{{- if .Values.gameid }} --gameid {{ .Values.gameid }}{{- else if .Values.setGame }} --gameid {{ (last (splitList "/" .Values.gameUrl)) }}{{- end }}"
        ports:
          - name: minetest
            containerPort: {{ .Values.minetestPort }}
            protocol: UDP
        {{- with .Values.resources }}
        resources:
        {{- .|toYaml|nindent 10}}
        {{- end }}
      volumes:
        - name: minetest-config
          persistentVolumeClaim:
            claimName: {{ include "minetest.fullname" . }}-config
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
  strategy:
    type: Recreate

---

apiVersion: v1
kind: Service
metadata:
  name: {{ include "minetest.fullname" . }}
  labels:
    app: {{ include "minetest.fullname" . }}
    component: minetest
spec:
  type: {{ .Values.service.type }}
  {{- if (or (eq .Values.service.type "LoadBalancer") (eq .Values.service.type "NodePort")) }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy | quote }}
  {{- end }}
  selector:
    app: {{ include "minetest.fullname" . }}
    component: minetest
  ports:
  - name: minetest
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
    protocol: UDP
